<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rutinas Gym</title>
<meta name="description" content="Registro de rutinas de gimnasio">
<meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1016" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rutinas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: app de una pantalla — zona con scroll, barra de descanso y pestañas abajo. Tipos de serie con los colores de los discos olímpicos (amarillo 15, azul 20, rojo 25). */
:root{
  --bg:#eef1f5;--surface:#ffffff;--surface2:#f3f5f9;--line:#dbe0e8;--fg:#111720;--muted:#5b6677;
  --accent:#1d5bd8;--accent-ink:#ffffff;--accent-soft:#e2eafb;
  --done-bg:#e0f3e6;--done-fg:#16733a;
  --plate-y:#a97b06;--plate-b:#1d5bd8;--plate-r:#c8322b;--danger:#c8322b;
  --scrim:rgba(10,14,20,.45);
  --shadow:0 1px 2px rgba(17,23,32,.05),0 3px 12px rgba(17,23,32,.05);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1016;--surface:#151b24;--surface2:#1c2431;--line:#283241;--fg:#e9eef4;--muted:#8f9bac;
  --accent:#5e91f2;--accent-ink:#0c1016;--accent-soft:#1a2740;
  --done-bg:#12301f;--done-fg:#62d38d;
  --plate-y:#e3b23c;--plate-b:#5e91f2;--plate-r:#f0635b;--danger:#f0635b;
  --scrim:rgba(0,0,0,.6);--shadow:0 1px 2px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1016;--surface:#151b24;--surface2:#1c2431;--line:#283241;--fg:#e9eef4;--muted:#8f9bac;
  --accent:#5e91f2;--accent-ink:#0c1016;--accent-soft:#1a2740;
  --done-bg:#12301f;--done-fg:#62d38d;
  --plate-y:#e3b23c;--plate-b:#5e91f2;--plate-r:#f0635b;--danger:#f0635b;
  --scrim:rgba(0,0,0,.6);--shadow:0 1px 2px rgba(0,0,0,.35);color-scheme:dark}

html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.4;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:minmax(0,1fr) auto auto}
main{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:6px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--f-display);font-weight:700;font-size:2.3rem;line-height:1;letter-spacing:.01em;text-transform:uppercase;margin:10px 0 2px;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:1.3rem;letter-spacing:.02em;text-transform:uppercase;margin:0}
h3{font-size:1.05rem;font-weight:700;margin:0}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.num-t{font-variant-numeric:tabular-nums}
.label{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:600;background:var(--surface2);color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.ghost{background:transparent;color:var(--accent);padding:8px 4px}
.btn.danger-t{background:transparent;color:var(--danger)}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:.92rem}
.btn:disabled{opacity:.45}
.icon-btn{border:0;background:var(--surface2);color:var(--muted);width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.row{display:flex;gap:10px;align-items:center}
.row.wrapr{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}

.card{background:var(--surface);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin-top:6px}

/* Plantillas */
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tpl{border:1px solid var(--line);text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:none}
.tpl-name{font-family:var(--f-display);font-weight:700;font-size:1.25rem;text-transform:uppercase;letter-spacing:.02em}
.tpl-list{font-size:.86rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tpl-last{font-size:.78rem;color:var(--muted);margin-top:auto}

/* Entreno activo */
.wk-head{display:flex;gap:12px;align-items:center;position:sticky;top:-6px;z-index:5;background:var(--bg);padding-block:10px 8px}
.wk-meta{flex:1;min-width:0;display:flex;flex-direction:column}
.wk-name{border:0;background:transparent;font-family:var(--f-display);font-weight:700;font-size:1.7rem;text-transform:uppercase;letter-spacing:.01em;padding:0;width:100%;min-width:0}
.elapsed{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.ex{display:flex;flex-direction:column;gap:6px;padding:12px}
.ex-top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.ex-name{flex:1;min-width:0;text-align:left;border:0;background:none;padding:0;color:var(--accent);font-weight:700;font-size:1.06rem}
.equip{color:var(--muted);font-weight:500;font-size:.88rem}
.set-row{display:grid;grid-template-columns:38px minmax(0,1fr) 66px 54px 40px;gap:6px;align-items:center;border-radius:9px;padding:3px 4px}
.set-row.head{font-size:.7rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding-block:0}
.set-row.head span{text-align:center}
.set-row.head span:nth-child(2){text-align:left}
.set-row.done{background:var(--done-bg)}
.setn{border:0;background:var(--surface2);border-radius:8px;height:34px;font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.set-row.done .setn{background:transparent}
.setn.t-w{color:var(--plate-y)}.setn.t-d{color:var(--plate-b)}.setn.t-f{color:var(--plate-r)}
.prev{font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.numin{width:100%;min-width:0;height:34px;border:1px solid transparent;border-radius:8px;background:var(--surface2);text-align:center;font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;padding:0 4px}
.numin::placeholder{color:var(--muted);opacity:.65}
.numin:focus{border-color:var(--accent);outline:none}
.set-row.done .numin{background:transparent}
.chk{border:0;height:34px;border-radius:8px;background:var(--surface2);color:var(--muted);font-weight:700;font-size:1rem}
.chk.on{background:var(--done-fg);color:var(--surface)}
.addset{align-self:stretch;margin-top:4px}
.hint{font-size:.82rem;color:var(--muted);text-align:center}
.hint b{font-family:var(--f-display);font-size:.95rem}
.c-w{color:var(--plate-y)}.c-d{color:var(--plate-b)}.c-f{color:var(--plate-r)}

/* Historial */
.month{margin:6px 0 -4px}
.sess{border:0;text-align:left;width:100%;display:flex;flex-direction:column;gap:8px}
.sess-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sess-name{font-family:var(--f-display);font-weight:700;font-size:1.25rem;text-transform:uppercase}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:.86rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pr-chip{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--plate-y)}
.sess-lines{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;font-size:.92rem}
.sess-lines .h{font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sess-lines .r{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner{background:var(--accent-soft);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-size:.92rem}

/* Ejercicios */
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.88rem;font-weight:600;white-space:nowrap;color:var(--fg)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.exlist{display:flex;flex-direction:column;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.exitem{display:flex;align-items:center;gap:12px;padding:11px 14px;border:0;background:none;text-align:left;border-bottom:1px solid var(--line);width:100%}
.exitem:last-child{border-bottom:0}
.exitem .badge{width:34px;height:34px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:var(--muted);flex:none}
.exitem.sel{background:var(--accent-soft)}
.exitem.sel .badge{background:var(--accent);color:var(--accent-ink)}

/* Perfil */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border-radius:12px;padding:12px;box-shadow:var(--shadow);min-width:0}
.tile .v{font-family:var(--f-display);font-weight:700;font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .k{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .bar{fill:var(--accent-soft)}
.chart .bar.cur{fill:var(--accent)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--accent-soft)}
.chart .dot{fill:var(--accent)}
.chart .dot-end{fill:var(--surface);stroke:var(--accent);stroke-width:2.5}
.chart .val{fill:var(--fg);font-size:12px;font-weight:700;font-family:var(--f-body)}

/* Descanso */
.timer-pick{display:flex;align-items:center;justify-content:center;gap:18px;padding-block:6px}
.tval{font-family:var(--f-display);font-weight:700;font-size:4rem;line-height:1;font-variant-numeric:tabular-nums;min-width:4ch;text-align:center}
.tbtn{border:0;width:60px;height:48px;border-radius:12px;background:var(--surface2);font-weight:700;font-size:1.05rem}
.timer-btn{width:44px;height:44px;color:var(--accent);background:var(--accent-soft)}
.timer-btn svg{width:24px;height:24px}
.flash{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:700;font-size:2.4rem;text-transform:uppercase;text-align:center;padding:24px;opacity:0;animation:flash 2.6s ease-out forwards}
@keyframes flash{0%{opacity:0}6%{opacity:.95}20%{opacity:.25}32%{opacity:.95}46%{opacity:.25}58%{opacity:.95}85%{opacity:.95}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.flash{animation:fade 2.6s linear forwards}@keyframes fade{0%,85%{opacity:.95}100%{opacity:0}}}
.rest{background:var(--surface);border-top:1px solid var(--line);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rest-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:8px}
.rest-time{font-family:var(--f-display);font-weight:700;font-size:1.6rem;font-variant-numeric:tabular-nums;min-width:62px}
.rest-track{flex:1;height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;min-width:30px}
.rest-fill{height:100%;background:var(--accent);border-radius:99px}

/* Pestañas */
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tab{position:relative;background:none;border:0;color:var(--muted);padding:8px 0 6px;font-weight:600;font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:3px}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent)}
.tab .dot{position:absolute;top:6px;left:calc(50% + 10px);width:8px;height:8px;border-radius:50%;background:var(--done-fg)}

/* Hoja inferior */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:640px;margin:0 auto;max-height:90%;overflow-y:auto;background:var(--surface);border-radius:18px 18px 0 0;padding-block:8px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 2px;flex:none}
.sheet-foot{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));background:var(--surface);padding-block:10px calc(18px + env(safe-area-inset-bottom,0px));margin-bottom:calc(-18px - env(safe-area-inset-bottom,0px));display:flex;gap:10px}
.sheet-foot .btn{flex:1}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select,textarea{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:16px;width:100%;min-width:0}
textarea{font-family:ui-monospace,Menlo,monospace;font-size:13px;min-height:120px;resize:vertical}
.edit-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:32px;height:32px;border-radius:8px;border:0;background:var(--surface2);font-weight:700}
.stepper span{min-width:44px;text-align:center;font-variant-numeric:tabular-nums;font-size:.9rem}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sets-tbl{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:4px 10px;font-size:.92rem;font-variant-numeric:tabular-nums}
.sets-tbl .sn{font-family:var(--f-display);font-weight:700;color:var(--muted)}
.sets-tbl .e1{color:var(--muted);text-align:right}
.big-title{font-family:var(--f-display);font-weight:700;font-size:1.8rem;text-transform:uppercase;line-height:1.05;text-wrap:balance}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.92rem;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet.anim{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
@media (max-width:360px){.set-row{grid-template-columns:32px minmax(0,1fr) 58px 48px 36px}.tiles .v{font-size:1.4rem}}
</style>
</head>
<body>
<div class="app">
  <main id="main"></main>
  <div class="rest" id="rest" hidden></div>
  <nav class="tabbar" aria-label="Secciones">
    <button class="tab" data-act="tab" data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Historial</button>
    <button class="tab" data-act="tab" data-tab="train"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>Entrenar<span class="dot" id="tabdot" hidden></span></button>
    <button class="tab" data-act="tab" data-tab="exercises"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>Ejercicios</button>
    <button class="tab" data-act="tab" data-tab="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>Perfil</button>
  </nav>
</div>
<div id="sheetwrap" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";
const KEY='rutinas-gym-v1';
const DAY=864e5;
const MUSCLES=['Pecho','Espalda','Hombros','Bíceps','Tríceps','Pierna','Glúteo','Core'];
const EQUIP=['Barra','Mancuernas','Polea','Máquina','Máquina Smith','Peso corporal','Otro'];
const LIB=[
['Press de banca','Barra','Pecho'],['Press de banca','Mancuernas','Pecho'],['Press inclinado','Mancuernas','Pecho'],['Press inclinado','Barra','Pecho'],
['Cruce de poleas','Polea','Pecho'],['Aperturas','Mancuernas','Pecho'],['Fondos','Peso corporal','Tríceps'],
['Press militar','Barra','Hombros'],['Press Arnold','Mancuernas','Hombros'],['Elevaciones laterales','Mancuernas','Hombros'],['Face pull','Polea','Hombros'],['Pájaros','Mancuernas','Hombros'],
['Dominadas','Peso corporal','Espalda'],['Remo con barra','Barra','Espalda'],['Jalón al pecho','Polea','Espalda'],['Remo en polea baja','Polea','Espalda'],['Remo con mancuerna','Mancuernas','Espalda'],['Peso muerto','Barra','Espalda'],['Encogimientos','Mancuernas','Espalda'],
['Curl de bíceps','Barra','Bíceps'],['Curl martillo','Mancuernas','Bíceps'],['Curl en polea','Polea','Bíceps'],['Curl inclinado','Mancuernas','Bíceps'],
['Extensión de tríceps','Polea','Tríceps'],['Press francés','Barra','Tríceps'],['Extensión sobre la cabeza','Mancuernas','Tríceps'],
['Sentadilla','Barra','Pierna'],['Sentadilla búlgara','Mancuernas','Pierna'],['Prensa de pierna','Máquina','Pierna'],['Extensión de cuádriceps','Máquina','Pierna'],['Curl femoral','Máquina','Pierna'],['Peso muerto rumano','Barra','Pierna'],['Zancadas','Mancuernas','Pierna'],['Elevación de gemelos','Máquina','Pierna'],
['Hip thrust','Barra','Glúteo'],['Patada de glúteo','Polea','Glúteo'],
['Plancha','Peso corporal','Core'],['Crunch en polea','Polea','Core'],['Elevación de piernas colgado','Peso corporal','Core']
];
const ICON={timer:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg>',dots:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>'};

const uid=()=>Math.random().toString(36).slice(2,10);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null};
const fmtN=n=>Number(n||0).toLocaleString('es',{maximumFractionDigits:1});
const e1rm=(w,r)=>(w>0&&r>0)?(r===1?w:w*(1+r/30)):0;
const pad=n=>String(n).padStart(2,'0');

function seed(){
  const exercises=LIB.map((x,i)=>({id:'x'+i,name:x[0],equip:x[1],muscle:x[2]}));
  const id=(n,e)=>exercises.find(x=>x.name===n&&x.equip===e).id;
  const push=[['Press de banca','Barra',4],['Press inclinado','Mancuernas',3],['Press militar','Barra',3],['Elevaciones laterales','Mancuernas',3],['Extensión de tríceps','Polea',3]];
  const pull=[['Dominadas','Peso corporal',3],['Remo con barra','Barra',4],['Jalón al pecho','Polea',3],['Face pull','Polea',3],['Curl de bíceps','Barra',3]];
  const legs=[['Sentadilla','Barra',4],['Peso muerto rumano','Barra',3],['Prensa de pierna','Máquina',3],['Curl femoral','Máquina',3],['Elevación de gemelos','Máquina',4]];
  const T=(name,list)=>({id:uid(),name,items:list.map(([n,e,s])=>({exId:id(n,e),sets:s}))});
  const templates=[T('Push',push),T('Pull',pull),T('Pierna',legs)];
  const base={'Press de banca|Barra':[60,8],'Press inclinado|Mancuernas':[22,10],'Press militar|Barra':[37.5,8],'Elevaciones laterales|Mancuernas':[8,12],'Extensión de tríceps|Polea':[25,12],'Dominadas|Peso corporal':[0,8],'Remo con barra|Barra':[55,8],'Jalón al pecho|Polea':[50,10],'Face pull|Polea':[20,15],'Curl de bíceps|Barra':[25,10],'Sentadilla|Barra':[80,6],'Peso muerto rumano|Barra':[70,8],'Prensa de pierna|Máquina':[140,10],'Curl femoral|Máquina':[35,12],'Elevación de gemelos|Máquina':[60,15]};
  const plan=[[push,0,20],[pull,1,18],[legs,2,16],[push,0,13],[pull,1,11],[legs,2,9],[push,0,6],[pull,1,4],[legs,2,2]];
  const now=Date.now();const history=[];
  plan.forEach(([list,ti,ago],k)=>{
    const cycle=Math.floor(k/3);const d=new Date(now-ago*DAY);d.setHours(18,30,0,0);const start=d.getTime();
    const exs=list.map(([n,e,s])=>{const b=base[n+'|'+e];const inc=b[0]>=50?2.5:(b[0]>0?1:0);const w=b[0]+inc*cycle;const r=b[0]===0?b[1]+cycle:b[1];
      return {exId:id(n,e),sets:Array.from({length:s},(_,j)=>({w,r:j===s-1?Math.max(r-1,1):r,t:'n',done:true}))}});
    history.push({id:uid(),name:templates[ti].name,tplId:templates[ti].id,start,end:start+(50+k*2)*60000,example:true,exercises:exs});
  });
  return {v:1,exercises,templates,history,active:null,rest:null,settings:{unit:'kg',rest:90,autoRest:true,keepAwake:true}};
}
function load(){try{const t=localStorage.getItem(KEY);if(t){const d=JSON.parse(t);if(d&&Array.isArray(d.exercises))return d}}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

function addTpl(flag,name,need){
  if(S.settings[flag])return;
  const items=need.map(([n,e,m,s])=>{let x=S.exercises.find(q=>q.name===n&&q.equip===e);if(!x){x={id:uid(),name:n,equip:e,muscle:m};S.exercises.push(x)}return {exId:x.id,sets:s}});
  S.templates.push({id:uid(),name,items});
  S.settings[flag]=true;save();
}

function lastSets(exId){for(let i=S.history.length-1;i>=0;i--){const ex=S.history[i].exercises.find(x=>x.exId===exId);if(ex)return ex.sets}return null}
function sessVolume(s){let v=0;s.exercises.forEach(ex=>ex.sets.forEach(x=>v+=(x.w||0)*(x.r||0)));return v}
function sessSets(s){return s.exercises.reduce((a,ex)=>a+ex.sets.length,0)}
function bestSet(sets){let b=null,bv=-1;sets.forEach(s=>{const v=e1rm(s.w,s.r)||s.r/1000;if(v>bv){bv=v;b=s}});return b}
const setTxt=s=>s?(s.w>0?`${fmtN(s.w)} ${U()} × ${s.r}`:`${s.r} reps`):'—';
const setTxtShort=s=>s?(s.w>0?`${fmtN(s.w)} × ${s.r}`:`${s.r} reps`):'—';
function fmtClock(ms){const t=Math.max(0,Math.floor(ms/1000));const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return h?`${h}:${pad(m)}:${pad(s)}`:`${m}:${pad(s)}`}
function fmtDur(ms){const m=Math.max(1,Math.round(ms/60000));const h=Math.floor(m/60);return h?`${h} h ${m%60} min`:`${m} min`}
const sod=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
function ago(t){const d=Math.round((sod(Date.now())-sod(t))/DAY);return d<=0?'hoy':d===1?'ayer':`hace ${d} días`}
const fmtDate=t=>new Date(t).toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'});
function weekStart(t){const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()-((d.getDay()+6)%7)*DAY}
function partName(){const h=new Date().getHours();return h<12?'Entreno de la mañana':h<19?'Entreno de la tarde':'Entreno de la noche'}
function prsOf(sess,beforeList){
  const out=[];
  sess.exercises.forEach(ex=>{
    let prev=0,seen=false;
    beforeList.forEach(h=>{if(h.id===sess.id||h.start>=sess.start)return;h.exercises.forEach(x=>{if(x.exId===ex.exId){seen=true;x.sets.forEach(s=>{if(s.t!=='w')prev=Math.max(prev,e1rm(s.w,s.r))})}})});
    let cur=0;ex.sets.forEach(s=>{if(s.t!=='w')cur=Math.max(cur,e1rm(s.w,s.r))});
    if(seen&&cur>0&&cur>prev+0.01)out.push({exId:ex.exId,v:cur});
  });
  return out;
}

function exListHTML(q,m,picked){
  const qq=q.trim().toLowerCase();
  const cnt={};S.history.forEach(h=>h.exercises.forEach(x=>cnt[x.exId]=(cnt[x.exId]||0)+1));
  const list=S.exercises.filter(e=>(m==='Todos'||e.muscle===m)&&(!qq||(e.name+' '+e.equip+' '+e.muscle).toLowerCase().includes(qq)))

  }).join('');
}

/* ---------- Gráficas ---------- */
function barChart(weeks){
  const W=340,H=150,l=26,r=8,t=14,b=24;const top=Math.max(3,...weeks.map(w=>w.v));const step=top<=5?1:Math.ceil(top/4);const max=Math.ceil(top/step)*step;const ticks=[];for(let v=0;v<=max;v+=step)ticks.push(v);
  const bw=(W-l-r)/weeks.length;const y=v=>t+(H-t-b)*(1-v/max);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Entrenos por semana, últimas 8 semanas">`;
  ticks.forEach(v=>{s+=`<line class="grid" x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${l-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`});
  weeks.forEach((w,i)=>{const x=l+i*bw+bw*0.18,ww=bw*0.64;const h=Math.max(0,y(0)-y(w.v));
    s+=`<rect class="bar${w.cur?' cur':''}" x="${x}" y="${y(w.v)}" width="${ww}" height="${h}" rx="3"/>`;
    if(w.v)s+=`<text class="val" x="${x+ww/2}" y="${y(w.v)-4}" text-anchor="middle">${w.v}</text>`;
    if(i%2===1||w.cur){const d=new Date(w.t);s+=`<text class="ax" x="${x+ww/2}" y="${H-6}" text-anchor="middle">${w.cur?'Esta':d.getDate()+'/'+(d.getMonth()+1)}</text>`}
  });
  return s+'</svg>';
}
function lineChart(pts){
  if(pts.length<2)return '<p class="muted small" style="margin:0">Con dos sesiones o más con peso verás aquí tu progreso.</p>';
  const W=340,H=160,l=40,r=14,t=16,b=24;
  const vs=pts.map(p=>p.v);let lo=Math.min(...vs),hi=Math.max(...vs);if(hi-lo<1){hi+=1;lo-=1}const padv=(hi-lo)*0.15;lo-=padv;hi+=padv;
  const t0=pts[0].t,t1=pts[pts.length-1].t;const x=v=>l+(W-l-r)*((v-t0)/Math.max(1,t1-t0));const y=v=>t+(H-t-b)*(1-(v-lo)/(hi-lo));
  const line=pts.map((p,i)=>(i?'L':'M')+x(p.t).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  const area=line+` L${x(t1).toFixed(1)} ${H-b} L${x(t0).toFixed(1)} ${H-b} Z`;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del 1RM estimado">`;
  [lo+padv,hi-padv].forEach(v=>{s+=`<line class="grid" x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${l-6}" y="${y(v)+4}" text-anchor="end">${fmtN(Math.round(v))}</text>`});
  s+=`<path class="area" d="${area}" opacity=".7"/><path class="ln" d="${line}"/>`;
  pts.forEach((p,i)=>{s+=`<circle class="${i===pts.length-1?'dot-end':'dot'}" cx="${x(p.t)}" cy="${y(p.v)}" r="${i===pts.length-1?5:3}"/>`});
  const d0=new Date(t0),d1=new Date(t1);
  s+=`<text class="ax" x="${l}" y="${H-6}">${d0.getDate()}/${d0.getMonth()+1}</text><text class="ax" x="${W-r}" y="${H-6}" text-anchor="end">${d1.getDate()}/${d1.getMonth()+1}</text>`;
  return s+'</svg>';
}

function setsTbl(sets){let n=0;return `<div class="sets-tbl">${sets.map(s=>{const lab=s.t==='n'?++n:s.t.toUpperCase();const e=e1rm(s.w,s.r);return `<span class="sn ${s.t!=='n'?'c-'+s.t:''}">${lab}</span><span>${setTxt(s)}</span><span class="e1">${e&&s.r>1?'1RM '+fmtN(Math.round(e)):''}</span>`}).join('')}</div>`}

/* ---------- Render ---------- */
function render(){
  const m=$('#main');const st=m.scrollTop;m.innerHTML=VIEWS[ui.tab]();m.scrollTop=st;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===ui.tab));
  $('#tabdot').hidden=!S.active;
  renderSheet();renderRest();
}
function renderSheet(){
  const w=$('#sheetwrap');
  if(!ui.sheet){w.hidden=true;w.innerHTML='';return}
  const old=w.querySelector('.sheet');const same=old&&old.dataset.type===ui.sheet.type;const st=same?old.scrollTop:0;
  w.innerHTML=`<div class="scrim" data-act="close"></div><div class="sheet${same?'':' anim'}" role="dialog" aria-modal="true" data-type="${ui.sheet.type}"><div class="grab"></div>${SHEETS[ui.sheet.type]()}</div>`;
  w.hidden=false;w.querySelector('.sheet').scrollTop=st;
}
function openSheet(s){ui.sheet=s;ui.confirm=null;renderSheet()}
function closeSheet(){ui.sheet=null;ui.confirm=null;render()}
function renderRest(){
  const el=$('#rest');
  if(!S.rest){el.hidden=true;return}
  const left=S.rest.end-Date.now();const pct=Math.max(0,Math.min(100,left/S.rest.total*100));
  if(el.hidden||!el.firstChild){el.innerHTML=`<div class="rest-in"><span class="label">Descanso</span><span class="rest-time" id="rest-time"></span><div class="rest-track"><div class="rest-fill" id="rest-fill"></div></div><button class="btn sm" data-act="restMinus">−15</button><button class="btn sm" data-act="restPlus">+15</button><button class="btn sm primary" data-act="restSkip">Saltar</button></div>`;el.hidden=false}
  $('#rest-time').textContent=fmtClock(left+999);$('#rest-fill').style.width=pct+'%';
}
let toastT;function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2400)}
let confT;function confirmTap(key){if(ui.confirm===key){ui.confirm=null;clearTimeout(confT);return true}ui.confirm=key;clearTimeout(confT);confT=setTimeout(()=>{ui.confirm=null;render()},3500);render();return false}

/* ---------- Audio, vibración, pantalla encendida ---------- */
let actx=null;
function ensureAudio(){try{if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(C)actx=new C()}if(actx&&actx.state==='suspended')actx.resume()}catch(e){}}
function tone(f,t0,dur,vol){const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=f;const t=actx.currentTime+t0;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.012);g.gain.setValueAtTime(vol,t+dur*0.6);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+dur+0.02)}
function beepTick(){try{if(!actx)return;if(actx.state!=='running')actx.resume();tone(784,0,0.14,0.5)}catch(e){}}
function beep(){try{if(!actx)return;if(actx.state!=='running')actx.resume();[[988,0],[988,0.28],[1319,0.56]].forEach(([f,d])=>tone(f,d,0.22,0.7));tone(1319,0.84,0.7,0.7)}catch(e){}}
function flash(){const f=document.createElement('div');f.className='flash';f.innerHTML='<span>¡A la siguiente serie!</span>';document.body.appendChild(f);setTimeout(()=>f.remove(),2600);f.addEventListener('click',()=>f.remove())}
let wake=null;
async function requestWake(){try{if(S.active&&S.settings.keepAwake!==false&&navigator.wakeLock&&!wake){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>wake=null)}}catch(e){wake=null}}
function releaseWake(){try{wake&&wake.release()}catch(e){}wake=null}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){requestWake();render()}});

/* ---------- Acciones ---------- */
function startWorkout(name,items,tplId){
  S.active={name,start:Date.now(),tplId:tplId||null,exercises:items.map(it=>({exId:it.exId,sets:Array.from({length:Math.max(1,it.sets)},()=>({w:'',r:'',t:'n',done:false}))}))};
  S.rest=null;save();ui.tab='train';ui.sheet=null;ui.confirm=null;render();$('#main').scrollTop=0;requestWake();
}
function startRest(sec){S.rest={end:Date.now()+sec*1000,total:sec*1000};save();renderRest()}
function addExercises(ids){
  if(ui.sheet&&ui.sheet.target==='edit'){ids.forEach(id=>ui.draft.items.push({exId:id,sets:3}));ui.picked=[];openSheet({type:'edit'});return}
  ids.forEach(id=>{const p=lastSets(id);S.active.exercises.push({exId:id,sets:Array.from({length:p?p.length:3},()=>({w:'',r:'',t:'n',done:false}))})});
  save();ui.picked=[];ui.sheet=null;render();
  const m=$('#main');m.scrollTop=m.scrollHeight;
}
function tplFromSession(s){const t={id:uid(),name:s.name,items:s.exercises.map(ex=>({exId:ex.exId,sets:ex.sets.length}))};S.templates.push(t);save();return t}
function doImport(text){
  try{const d=JSON.parse(text);if(!d||!Array.isArray(d.exercises)||!Array.isArray(d.history)||!Array.isArray(d.templates))throw 0;
    S=Object.assign({v:1,active:null,rest:null},d);S.settings=Object.assign({unit:'kg',rest:90,autoRest:true,keepAwake:true},d.settings||{});S.history.sort((a,b)=>a.start-b.start);
    save();ui.sheet=null;ui.tab='history';render();toast('Copia importada')}
  catch(e){toast('Ese texto no es una copia válida de Rutinas Gym')}
}

const A={
  tab(b){ui.tab=b.dataset.tab;ui.confirm=null;render();$('#main').scrollTop=0},
  close(){closeSheet()},
  startEmpty(){startWorkout(partName(),[],null)},

  pickToggle(b){const id=b.dataset.id;const k=ui.picked.indexOf(id);k<0?ui.picked.push(id):ui.picked.splice(k,1);renderSheet()},

    if(ui.sheet.back==='pick'){ui.picked.push(e.id);ui.pq='';openSheet({type:'pick',target:ui.sheet.target})}else{closeSheet();toast('Ejercicio creado')}},
  muscle(b){ui.m=b.dataset.m;render()},
  exinfo(b){const back=ui.sheet&&ui.sheet.type==='exmenu'?ui.sheet:null;openSheet({type:'exinfo',id:b.dataset.id,back})},
  exinfoBack(){openSheet(ui.sheet.back)},
  settype(b){const s=S.active.exercises[+b.dataset.i].sets[+b.dataset.j];const o=['n','w','d','f'];s.t=o[(o.indexOf(s.t)+1)%4];save();render()},
  check(b){const i=+b.dataset.i,j=+b.dataset.j;const ex=S.active.exercises[i];const s=ex.sets[j];
    if(s.done){s.done=false;save();render();return}
    const p=(lastSets(ex.exId)||[])[j];
    if(s.w===''&&p&&p.w>0)s.w=String(p.w);
    if(s.r===''&&p)s.r=String(p.r);
    if(num(s.r)===null){render();const r=$('#r-'+i+'-'+j);r&&r.focus();toast('Escribe las repeticiones');return}
    s.done=true;save();render();if(S.settings.autoRest!==false)startRest(ex.rest||S.settings.rest)},
  addset(b){const ex=S.active.exercises[+b.dataset.i];ex.sets.push({w:'',r:'',t:'n',done:false});save();render()},

  exRest(b){S.active.exercises[ui.sheet.i].rest=+b.dataset.s;save();renderSheet()},
  exPopSet(){const ex=S.active.exercises[ui.sheet.i];if(ex.sets.length>1)ex.sets.pop();save();render()},
  exUp(){const a=S.active.exercises,i=ui.sheet.i;if(i>0){[a[i-1],a[i]]=[a[i],a[i-1]];ui.sheet.i=i-1;save();render()}},
  exDown(){const a=S.active.exercises,i=ui.sheet.i;if(i<a.length-1){[a[i+1],a[i]]=[a[i],a[i+1]];ui.sheet.i=i+1;save();render()}},
  exDel(){if(!confirmTap('exdel'))return;S.active.exercises.splice(ui.sheet.i,1);save();closeSheet()},
  finish(){openSheet({type:'finish'})},
  finishSave(){const a=S.active;
    const exs=a.exercises.map(ex=>({exId:ex.exId,sets:ex.sets.filter(s=>s.done).map(s=>({w:num(s.w)||0,r:num(s.r)||0,t:s.t,done:true}))})).filter(ex=>ex.sets.length);
    const sess={id:uid(),name:(a.name||'').trim()||'Entreno',tplId:a.tplId,start:a.start,end:Date.now(),exercises:exs};
    const prs=prsOf(sess,S.history);
    S.history.push(sess);S.active=null;S.rest=null;save();releaseWake();
    ui.tab='history';ui.sheet={type:'summary',id:sess.id,prs};render();$('#main').scrollTop=0},
  discard(){S.active=null;S.rest=null;save();releaseWake();closeSheet();toast('Entreno descartado')},
  cancelwk(){if(!confirmTap('cancel'))return;A.discard()},
  timer(){ui.timerSel=S.rest?Math.round(S.rest.total/1000):S.settings.rest;openSheet({type:'timer'})},
  timerSel(b){ui.timerSel=+b.dataset.s;renderSheet()},
  timerAdj(b){ui.timerSel=Math.max(15,Math.min(900,ui.timerSel+(+b.dataset.d)));renderSheet()},
  timerStart(){const s=ui.timerSel;ui.sheet=null;ui.confirm=null;renderSheet();startRest(s)},
  autoRest(b){S.settings.autoRest=b.dataset.v==='1';save();if(ui.sheet){renderSheet();return}render();toast(S.settings.autoRest?'El descanso empezará solo al marcar cada serie':'El descanso solo empieza cuando lo inicies tú')},
  keepAwake(b){S.settings.keepAwake=b.dataset.v==='1';save();if(S.settings.keepAwake)requestWake();else releaseWake();render();toast(S.settings.keepAwake?'La pantalla no se apagará mientras entrenas':'La pantalla se apagará con el tiempo normal del iPhone')},
  restMinus(){if(S.rest){S.rest.end-=15000;save();renderRest()}},
  restPlus(){if(S.rest){S.rest.end+=15000;S.rest.total+=15000;save();renderRest()}},
  restSkip(){S.rest=null;save();renderRest()},
  sess(b){openSheet({type:'sess',id:b.dataset.id})},
  sessRepeat(){const s=S.history.find(x=>x.id===ui.sheet.id);if(!s)return;
    if(S.active){toast('Termina o cancela el entreno en curso primero');return}
    startWorkout(s.name,s.exercises.map(ex=>({exId:ex.exId,sets:ex.sets.length})),s.tplId)},
  sessTpl(){const s=S.history.find(x=>x.id===ui.sheet.id);if(s){tplFromSession(s);toast('Plantilla «'+s.name+'» guardada')}},
  summaryTpl(){const s=S.history.find(x=>x.id===ui.sheet.id);if(s){const t=tplFromSession(s);s.tplId=t.id;save();renderSheet();toast('Plantilla guardada')}},
  sessDel(){if(!confirmTap('sess')){renderSheet();return}S.history=S.history.filter(x=>x.id!==ui.sheet.id);save();closeSheet();toast('Entreno eliminado')},
  clearExamples(){if(!confirmTap('ex'))return;S.history=S.history.filter(x=>!x.example);save();render();toast('Ejemplos borrados')},
  unit(b){S.settings.unit=b.dataset.u;save();render()},
  defRest(b){S.settings.rest=+b.dataset.s;save();render()},
  export(){openSheet({type:'export'})},
  copyExp(){const ta=$('#exp-text');const fallback=()=>{ta.focus();ta.select();toast('Selecciona el texto y cópialo')};
    try{navigator.clipboard.writeText(ta.value).then(()=>toast('Copia copiada al portapapeles'),fallback)}catch(e){fallback()}},
  importOpen(){openSheet({type:'import'})},
  importText(){const t=$('#imp-text').value.trim();if(!t){toast('Pega el texto o elige un archivo');return}doImport(t)}
};

document.addEventListener('click',ev=>{
  ensureAudio();
  const b=ev.target.closest('[data-act]');if(!b||b.disabled)return;
  const f=A[b.dataset.act];if(f){ev.preventDefault();f(b)}
});
document.addEventListener('input',ev=>{
  const el=ev.target;
  if(el.dataset&&el.dataset.f&&S.active){const s=S.active.exercises[+el.dataset.i].sets[+el.dataset.j];s[el.dataset.f]=el.value;save();return}
  if(el.id==='wk-name'&&S.active){S.active.name=el.value;save();return}
  if(el.id==='ex-q'){ui.q=el.value;$('#exlist').innerHTML=exListHTML(ui.q,ui.m,null);return}
  if(el.id==='pick-q'){ui.pq=el.value;$('#pick-list').innerHTML=exListHTML(ui.pq,'Todos',ui.picked);return}
  if(el.id==='tpl-name'&&ui.draft){ui.draft.name=el.value}
});
document.addEventListener('change',ev=>{
  if(ev.target.id==='imp-file'){const f=ev.target.files&&ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>doImport(String(r.result));r.onerror=()=>toast('No se pudo leer el archivo');r.readAsText(f)}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&ui.sheet)closeSheet()});

let lastTick=0;
setInterval(()=>{
  if(S.active){const el=$('#elapsed');if(el)el.textContent=fmtClock(Date.now()-S.active.start)}
  if(S.rest){const left=S.rest.end-Date.now();if(left<=0){S.rest=null;lastTick=0;save();renderRest();beep();flash();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}else{const sec=Math.ceil(left/1000);if(sec<=3&&sec!==lastTick&&left>200){lastTick=sec;beepTick()}else if(sec>3)lastTick=0;renderRest()}}
},250);

render();
if(S.active)requestWake();
})();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})})}
</script>
</body>
